<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>SoundFlow</title>
</head>
<body>
    
    <audio src="audio/ananegm.mp3"></audio>

    <div class="main-container">
        <div class="playlist"></div>
        
            <div class="audio-container">
            <div class="image-container">
                <img src="images/image-1.png" alt="">
            </div>
            <h2 id="head"></h2>
            <div class="volume-container">
                <input type="range" min="0" max="1" step="0.01" value="1" id="volumeRange">
                <i class="fa-solid fa-volume-high" id="mute"></i>
                <span id="volumeValue"></span>
            </div>
            <div class="duration-container">
                <span id="durationTime">00:00</span>
                <input type="range" min="0" value="0" id="durationRange">
                <span id="totalDuration"></span>
            </div>
            <div class="btns-container">
                <i class="fa-solid fa-backward" id="backward"></i>
                <i class="fa-solid fa-play" id="play"></i>
                <i class="fa-solid fa-pause" id="pause"></i>
                <i class="fa-solid fa-stop" id="stop"></i>
                <i class="fa-solid fa-gauge" id="speed"></i>
                <i class="fa-solid fa-forward" id="forward"></i>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
